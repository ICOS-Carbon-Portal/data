cpdata {
	# sample NetCDF files that ship with the repo
	netcdf.folder = "./src/test/resources/"

	# meta (default shown; change if your meta runs elsewhere)
	meta.baseUrl = "http://127.0.0.1:9094/"

	# PostGIS from the infrastructure repo (host/port/dbNames/users match the defaults).
	# Passwords: see your infrastructure's devops/dev.inventory/group_vars/core_host/passwords.yml
	postgis {
		hostname = "127.0.0.1"
		port = 5438
		admin.password  = "admin_pass"
		reader.password = "reader_pass"
		writer.password = "writer_pass"
	}
}

# Without this, every page on http://localhost:9011 returns 400 "Unexpected host localhost, cannot find corresponding ENVRI"
metacore.envriConfigs.ICOS.dataHost = "localhost"